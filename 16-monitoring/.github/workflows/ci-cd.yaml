# .github/workflows/ci-cd.yaml
name: MobiCash MLOps Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.10"
  DOCKER_IMAGE: mobicash/churn-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: pytest tests/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy to Cloud Run (Staging)
        run: |
          echo "Deploying to staging environment..."
          # In production, this would use gcloud or similar CLI
          # gcloud run deploy mobicash-api-staging \
          #   --image=${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
          #   --region=africa-south1