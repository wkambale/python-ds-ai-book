# .github/workflows/monitoring.yaml
name: Weekly Model Monitoring

on:
  schedule:
    # Run every Monday at 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  drift-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Run drift detection script
        run: python scripts/detect_drift.py
      - name: Upload Report
        uses: actions/upload-artifact@v3
        with:
          name: drift-report
          path: reports/

      - name: Send alert if drift detected
        if: failure()
        run: |
          # Send Slack/email notification
          echo "Alert: Significant drift detected!"